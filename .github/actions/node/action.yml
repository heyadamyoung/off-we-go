name: Node with the dependencies installed
description: >-
  pnpm through corepack, Node 22 with the pnpm store cached by lockfile, and a
  frozen install of app/. Every job that runs anything of the app starts here.
runs:
  using: composite
  steps:
    # Before setup-node, whose cache of the pnpm store needs pnpm on the path.
    # From pnpm's own release rather than through corepack, which fetched the
    # tarball from the npm registry on every job and took four seconds over it.
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        version: 10.6.5

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version: 22
        cache: pnpm
        cache-dependency-path: app/pnpm-lock.yaml

    - name: Install dependencies
      shell: bash
      working-directory: app
      run: pnpm install --frozen-lockfile
