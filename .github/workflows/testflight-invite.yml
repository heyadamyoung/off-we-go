name: TestFlight testers and build status

# Adding a tester is a two-field job that otherwise means a trip through App
# Store Connect. The key is already a secret here, so the trip is a dispatch.
on:
  workflow_dispatch:
    inputs:
      email:
        description: The tester's email address — leave empty to just report build status
        required: false
        type: string
      name:
        description: Their name, if you want Apple to show one
        required: false
        type: string
      group:
        description: The group to add them to (defaults to the external group)
        required: false
        type: string
      expire:
        description: Set to "superseded" to expire every build below the newest valid one
        required: false
        type: string
      distribute:
        description: Set to "latest" to push the newest approved build to external testers
        required: false
        type: string

permissions:
  contents: read

jobs:
  invite:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Distribute the newest approved build to external testers
        if: ${{ inputs.distribute == 'latest' }}
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
        run: node scripts/testflightDistribute.mjs

      # Before the status report, so the run's log ends on the cleaned state.
      - name: Expire superseded builds
        if: ${{ inputs.expire == 'superseded' }}
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
        run: node scripts/testflightExpire.mjs

      - name: Report what App Store Connect makes of recent builds
        if: ${{ inputs.email == '' }}
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
        run: node scripts/testflightStatus.mjs

      - name: Add them to the group
        if: ${{ inputs.email != '' }}
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
          TESTER_EMAIL: ${{ inputs.email }}
          TESTER_NAME: ${{ inputs.name }}
          TESTER_GROUP: ${{ inputs.group }}
        run: node scripts/testflightInvite.mjs
