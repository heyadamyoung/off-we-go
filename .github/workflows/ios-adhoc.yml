name: iOS Ad Hoc

on:
  # Only what ends up inside the binary, same filter as TestFlight, so the
  # registered-device link always serves the latest app without rebuilding
  # for server-only or Android-only changes.
  push:
    branches: [main]
    paths:
      - 'app/src/**'
      - 'app/public/**'
      - 'app/ios/**'
      - 'app/capacitor.config.json'
      - 'app/pnpm-lock.yaml'
      - 'app/vite.config.ts'
      - 'app/tsconfig.json'
      - '.github/workflows/ios-adhoc.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: off-we-go-ios-adhoc
  # A flurry of pushes should leave one build, not five. The last one wins.
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
      IOS_ADHOC_PROVISIONING_PROFILE_NAME: ${{ vars.IOS_ADHOC_PROVISIONING_PROFILE_NAME }}
      WAYFARE_DOMAIN: offwego.to
      GH_TOKEN: ${{ github.token }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.6.5

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install and synchronize iOS
        run: pnpm install --frozen-lockfile && VITE_API_URL="https://${WAYFARE_DOMAIN}/api" pnpm ios:sync

      - name: Install CocoaPods
        run: cd ios/App && pod install

      - name: Install Ad Hoc signing materials
        env:
          IOS_DISTRIBUTION_CERTIFICATE_P12: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/off-we-go-adhoc-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          CERTIFICATE_PATH="$RUNNER_TEMP/off-we-go-distribution.p12"
          PROFILE_DIRECTORY="$HOME/Library/MobileDevice/Provisioning Profiles"
          APP_STORE_PROFILE_PATH="$PROFILE_DIRECTORY/OffWeGo_App_Store_CI.mobileprovision"

          printf '%s' "$IOS_DISTRIBUTION_CERTIFICATE_P12" | base64 -D > "$CERTIFICATE_PATH"
          mkdir -p "$PROFILE_DIRECTORY"
          printf '%s' "$IOS_PROVISIONING_PROFILE" | base64 -D > "$APP_STORE_PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Register devices and refresh Ad Hoc profile
        env:
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          IOS_ADHOC_DEVICES: ${{ secrets.IOS_ADHOC_DEVICES }}
        run: |
          DEVICES_PATH="$RUNNER_TEMP/off-we-go-adhoc-devices.json"
          node scripts/iosAdHocDevices.mjs "$IOS_ADHOC_DEVICES" > "$DEVICES_PATH"
          echo "IOS_ADHOC_DEVICES_PATH=$DEVICES_PATH" >> "$GITHUB_ENV"
          if ! command -v fastlane >/dev/null 2>&1; then
            gem install fastlane --no-document
          fi
          IOS_ADHOC_DEVICES_PATH="$DEVICES_PATH" fastlane ios refresh_adhoc_profile

      - name: Create Ad Hoc export configuration
        run: >-
          node scripts/iosReleaseCore.mjs "$APPLE_TEAM_ID" "$IOS_BUNDLE_ID"
          "$IOS_ADHOC_PROVISIONING_PROFILE_NAME" ad-hoc > "$RUNNER_TEMP/ExportOptions.plist"

      - name: Archive Off We Go
        run: >-
          node scripts/iosArchive.mjs "$RUNNER_TEMP/OffWeGo.xcarchive"
          "$APPLE_TEAM_ID" "$GITHUB_RUN_NUMBER" "$WAYFARE_DOMAIN"

      - name: Export the signed IPA
        run: |
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/OffWeGo.xcarchive" \
            -exportPath "$RUNNER_TEMP/OffWeGoAdHoc" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Verify every registered device is authorized
        env:
          IOS_ADHOC_DEVICES: ${{ secrets.IOS_ADHOC_DEVICES }}
        run: |
          IPA_PATH="$(find "$RUNNER_TEMP/OffWeGoAdHoc" -type f -name '*.ipa' -print -quit)"
          test -n "$IPA_PATH"
          mkdir -p "$RUNNER_TEMP/OffWeGoVerify"
          unzip -q "$IPA_PATH" -d "$RUNNER_TEMP/OffWeGoVerify"
          APP_PATH="$(find "$RUNNER_TEMP/OffWeGoVerify/Payload" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          security cms -D -i "$APP_PATH/embedded.mobileprovision" > "$RUNNER_TEMP/EmbeddedProfile.plist"
          node scripts/iosAdHocDevices.mjs "$IOS_ADHOC_DEVICES" \
            | ruby -rjson -e 'JSON.parse(STDIN.read).each_value { |udid| puts udid }' \
            | while IFS= read -r udid; do
                /usr/libexec/PlistBuddy -c 'Print :ProvisionedDevices' "$RUNNER_TEMP/EmbeddedProfile.plist" \
                  | grep -Fq -- "$udid"
              done
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")" \
            = "$IOS_BUNDLE_ID"
          codesign --verify --deep --strict "$APP_PATH"
          cp "$IPA_PATH" "$RUNNER_TEMP/Wayfare.ipa"

      - name: Publish the registered-device build
        working-directory: .
        run: |
          TAG="wayfare-ipad-adhoc"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "Off We Go Registered Devices" \
              --notes "Signed Ad Hoc build for registered Off We Go test devices." \
              --prerelease
          else
            gh release create "$TAG" \
              --title "Off We Go Registered Devices" \
              --notes "Signed Ad Hoc build for registered Off We Go test devices." \
              --prerelease
          fi
          gh release upload "$TAG" "$RUNNER_TEMP/Wayfare.ipa" --clobber
