name: iOS compile

on:
  pull_request:
    paths: ['app/**', '.github/workflows/ios-build.yml']
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/ios-build.yml']
  workflow_dispatch:

jobs:
  simulator-build:
    runs-on: macos-15
    env:
      WAYFARE_DOMAIN: offwego.to
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.6.5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Install and synchronize iOS
        run: pnpm install --frozen-lockfile && VITE_API_URL="https://${WAYFARE_DOMAIN}/api" pnpm ios:sync
      - name: Install CocoaPods
        run: cd ios/App && pod install
      - name: Compile for iPhone and iPad simulator
        run: >-
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Debug
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO WAYFARE_DOMAIN="$WAYFARE_DOMAIN" build
