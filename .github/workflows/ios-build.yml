name: iOS compile

on:
  pull_request:
    paths: ['app/**', '.github/workflows/ios-build.yml']
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/ios-build.yml']
  workflow_dispatch:

jobs:
  simulator-build:
    runs-on: macos-15
    env:
      WAYFARE_DOMAIN: offwego.to
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.6.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Install and synchronize iOS
        run: pnpm install --frozen-lockfile && VITE_API_URL="https://${WAYFARE_DOMAIN}/api" pnpm ios:sync
      - name: Install CocoaPods
        run: cd ios/App && pod install
      - name: Compile for iPhone and iPad simulator
        run: >-
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Debug
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO WAYFARE_DOMAIN="$WAYFARE_DOMAIN" build
