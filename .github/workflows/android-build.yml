name: Android compile

on:
  pull_request:
    paths: ['app/**', '.github/workflows/android-build.yml']
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/android-build.yml']
  workflow_dispatch:

jobs:
  debug-build:
    runs-on: ubuntu-latest
    env:
      WAYFARE_DOMAIN: offwego.to
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.6.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      # Named rather than left to the action's default, which is
      # "tools platform-tools". `tools` is the old SDK Tools package, replaced
      # by the cmdline-tools this action installs for itself, and Google has
      # now dropped it from the SDK repository altogether — so sdkmanager
      # exits 1 on "Failed to find package 'tools'" before a line of this app
      # is compiled. Nothing in the Gradle build wanted it.
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: platform-tools
      - name: Install and synchronize Android
        run: pnpm install --frozen-lockfile && VITE_API_URL="https://${WAYFARE_DOMAIN}/api" pnpm android:sync
      - name: Test and compile the Kotlin app
        run: chmod +x android/gradlew && ./android/gradlew -p android testDebugUnitTest lintDebug assembleDebug
