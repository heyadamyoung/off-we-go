name: Deploy Off We Go to VPS

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/deploy-vps.yml'
      - '.github/actions/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: off-we-go-production
  cancel-in-progress: false

# Jobs side by side rather than one chain: pushed to live was ten and a half
# minutes, of which nine and a half were one runner doing everything in turn.
# Each job below sets itself up in a few seconds — the shared steps live in
# .github/actions, and what they fetch (the pnpm store, the browser, ffmpeg)
# comes out of the cache rather than off the network — and does its one thing.
# The deploy waits on all of them, so the test phase is the longest job and
# nothing else: the browser suite is dealt eight ways, the live suite runs on
# two stacks, and the release images are built here beside the tests, so the
# deploy is a pull and a restart.
jobs:
  checks:
    name: Lint, unit tests and the deployment entrypoint
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The guard runs Caddy to validate the Caddyfile (the image Dockerfile.web
      # ships on); pulled in the background here so the pull overlaps the
      # install rather than the guard waiting for it.
      - name: Fetch the guard's Caddy
        run: nohup docker pull caddy:2.10-alpine > /tmp/caddy-pull.log 2>&1 &

      - uses: ./.github/actions/node

      - name: Lint and format check
        run: pnpm lint

      # The web build is not repeated here: the web image job builds the very
      # bundle that ships, from the same tree, and fails the run if it cannot.
      - name: Run unit tests
        run: time pnpm test:unit

      # This runner has docker, so the compose check must run rather than
      # skip. Here rather than on a runner of its own: it is ten seconds, and
      # every job the run asks for is a runner it may wait on.
      - name: Test the restricted deployment entrypoint
        run: REQUIRE_DOCKER=1 pnpm test:guard

  server:
    name: Server tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The test database, started in the background before the install so
      # its pull and its first start overlap it rather than holding it up: as
      # a service container it was nine seconds at the front of the job with
      # the runner otherwise idle. It lives for the job and is never read
      # back, so its files sit on memory. After the checkout, because the
      # job's working directory is the checkout.
      - name: Start the test database
        run: |
          nohup docker run -d --name postgres -p 5432:5432 \
            --tmpfs /var/lib/postgresql/data \
            -e POSTGRES_DB=offwego_test -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres \
            postgres:17-alpine > /tmp/postgres-start.log 2>&1 &

      - uses: ./.github/actions/node

      # Without it every video test quietly SKIPS. They have been skipping here
      # since they were written — "ok … # SKIP ffmpeg is not installed on this
      # machine" reads as a pass in the summary, so converting, the rendition
      # ladder and the whole of the object-storage path have only ever been
      # proved on somebody's laptop. The api image installs ffmpeg; the runner
      # that tests it should have it too.
      - uses: ./.github/actions/ffmpeg

      - name: Wait for the test database
        run: |
          for _ in $(seq 60); do
            docker exec postgres pg_isready -U postgres -d offwego_test > /dev/null 2>&1 && exit 0
            sleep 1
          done
          echo "the test database never answered"; cat /tmp/postgres-start.log; docker logs postgres; exit 1

      - name: Run server tests
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/offwego_test
        run: time pnpm test:server

  browser:
    name: Browser tests (${{ matrix.shard }} of 8)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    strategy:
      fail-fast: true
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/node
      - uses: ./.github/actions/browser

      # The suite builds the sample-mode bundle itself (see playwright.config).
      # An eighth of the tests each, dealt round-robin so every shard holds
      # the same mix of light and heavy (see scripts/shard-tests.mjs), spread
      # across the runner's cores. Eight because a shard's own setup is a
      # dozen seconds and its tests were thirty-five: past this the setup is
      # most of the job.
      - name: Run browser tests
        run: |
          mapfile -t dealt < <(node scripts/shard-tests.mjs 8 ${{ matrix.shard }})
          time pnpm exec playwright test "${dealt[@]}"

      # A CI-only flake with no trace is unfixable folklore; a failure here
      # hands its Playwright traces and DOM snapshots to the run page instead.
      - name: Keep the failure traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: browser-test-results-${{ matrix.shard }}
          path: app/test-results/
          retention-days: 7
          if-no-files-found: ignore

  live:
    name: Browser tests against a real server (${{ matrix.half }})
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    strategy:
      fail-fast: true
      matrix:
        # Two stacks rather than one: the bulk upload alone is half a minute
        # of the server resizing, and every other spec was slowed by sharing
        # the server with it. The upload specs get a stack of their own.
        half: [uploads, everything-else]
        include:
          - half: uploads
            specs: tests/live/bulk-upload-live.spec.js tests/live/upload-progress-live.spec.js
          - half: everything-else
            specs: >-
              tests/live/day-bar-live.spec.js tests/live/download-live.spec.js
              tests/live/map-photos-live.spec.js tests/live/photo-copies-live.spec.js
              tests/live/photo-exif-live.spec.js tests/live/share-live.spec.js
              tests/live/trip-days-live.spec.js tests/live/video-upload-live.spec.js
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/node
      # This stack converts real video.
      - uses: ./.github/actions/ffmpeg
      - uses: ./.github/actions/browser

      # The sample-mode suite runs in the shards above, where uploads never
      # leave the tab. This one has a real server behind it, so "does a film
      # actually upload" is a question CI can answer rather than infer.
      # Playwright itself rather than the package script: the specs are the
      # arguments, and a package manager between them and Playwright once
      # kept the `--` and ran every spec on both stacks.
      - name: Run browser tests against a real server
        run: time pnpm exec playwright test --config playwright.live.config.ts ${{ matrix.specs }}

      - name: Keep the failure traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: live-test-results-${{ matrix.half }}
          path: app/test-results/
          retention-days: 7
          if-no-files-found: ignore

  images:
    name: Build the release images
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The parent too, to tell whether this release changed anything the
          # layer cache is made of.
          fetch-depth: 2

      - name: Sign in to the registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # The same Dockerfiles the box used to build from, built here instead
      # and pushed by commit. The layer cache lives in the registry too, so a
      # release that changed only source rebuilds only the layers that copy
      # source, and the box pulls only those.
      #
      # Both images on one runner, side by side, each with a builder of its
      # own: the api image is a pull of cached layers and a copy of the
      # server, the web image a build of the bundle, and a runner each was one
      # more machine the run had to be handed before the deploy could start.
      #
      # The cache is written back only when something it is made of changed:
      # the dependencies, the lockfile, a Dockerfile. Every other release
      # changes source alone, and the layers that copy source are never a
      # cache hit for the next commit — exporting them was thirty seconds of
      # recompressing the dependency layers for nothing, on every push.
      - name: Build and push
        env:
          IMAGE_REPO: ghcr.io/${{ github.repository }}
        run: |
          repo="${IMAGE_REPO,,}"
          export_cache=no
          if ! git rev-parse --verify --quiet HEAD~1 >/dev/null \
            || [ -n "$(git diff --name-only HEAD~1 HEAD -- package.json pnpm-lock.yaml server/Dockerfile Dockerfile.web .dockerignore)" ]; then
            export_cache=yes
          fi
          build() {
            local image=$1 file=$2
            local cache_to=()
            if [ "$export_cache" = yes ]; then
              cache_to=(--cache-to "type=registry,ref=$repo/$image:buildcache,mode=max,compression=zstd")
            fi
            docker buildx create --name "release-$image" >/dev/null
            docker buildx build \
              --builder "release-$image" \
              --file "$file" \
              --build-arg VITE_API_URL=/api \
              --build-arg "VITE_APP_SHA=$GITHUB_SHA" \
              --cache-from "type=registry,ref=$repo/$image:buildcache" \
              "${cache_to[@]}" \
              --tag "$repo/$image:$GITHUB_SHA" \
              --tag "$repo/$image:latest" \
              --push .
          }
          build api server/Dockerfile > /tmp/build-api.log 2>&1 &
          api=$!
          build web Dockerfile.web > /tmp/build-web.log 2>&1 &
          web=$!
          failed=0
          wait "$api" || failed=1
          wait "$web" || failed=1
          sed 's/^/[api] /' /tmp/build-api.log
          sed 's/^/[web] /' /tmp/build-web.log
          exit "$failed"

      - name: Sign out of the registry
        if: always()
        run: docker logout ghcr.io

  deploy:
    name: Deploy production
    needs: [checks, server, browser, live, images]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    environment:
      name: production
      url: https://offwego.to
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configure deployment SSH key
        env:
          VPS_DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Stage the release environment
        # /opt/wayfare/.env is not edited by hand. The values the running
        # server needs but the repository must never hold travel with the
        # release, and the deploy script folds them in and destroys the copy.
        env:
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
          MS_TENANT: ${{ secrets.MS_TENANT }}
          MAILBOX_TOKEN_KEY: ${{ secrets.MAILBOX_TOKEN_KEY }}
          CODEX_AUTH_JSON_B64: ${{ secrets.CODEX_AUTH_JSON_B64 }}
          GRAFANA_LOKI_TOKEN: ${{ secrets.GRAFANA_LOKI_TOKEN }}
          # Not secrets, just knobs — but nobody edits the box by hand, so they
          # ride the same pipeline. Empty values are skipped by merge-env.sh,
          # which leaves the compose defaults (luna, xhigh) in charge.
          WAYFARE_AI_MODEL: ${{ vars.WAYFARE_AI_MODEL }}
          WAYFARE_AI_REASONING: ${{ vars.WAYFARE_AI_REASONING }}
          # Which images this release is: the ones the images job pushed.
          IMAGE_REPO: ghcr.io/${{ github.repository }}
        run: |
          umask 077
          {
            echo "MS_CLIENT_ID=$MS_CLIENT_ID"
            echo "MS_CLIENT_SECRET=$MS_CLIENT_SECRET"
            echo "MS_TENANT=$MS_TENANT"
            echo "MAILBOX_TOKEN_KEY=$MAILBOX_TOKEN_KEY"
            echo "CODEX_AUTH_JSON_B64=$CODEX_AUTH_JSON_B64"
            echo "GRAFANA_LOKI_TOKEN=$GRAFANA_LOKI_TOKEN"
            echo "WAYFARE_AI_MODEL=$WAYFARE_AI_MODEL"
            echo "WAYFARE_AI_REASONING=$WAYFARE_AI_REASONING"
            echo "IMAGE_REPO=${IMAGE_REPO,,}"
            echo "IMAGE_TAG=$GITHUB_SHA"
          } > app/deploy/release.env

      # The pipeline's own token, good for this job and no longer: the box
      # signs in with it for the moment of the pull, signs out, and destroys
      # the copy before anything else runs (see deploy/github-deploy.sh).
      - name: Stage the registry credential
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          umask 077
          {
            echo "REGISTRY_USER=$REGISTRY_USER"
            echo "REGISTRY_TOKEN=$REGISTRY_TOKEN"
          } > app/deploy/registry.env

      - name: Stream release to the VPS
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
        run: |
          # tar's exit code is invisible without this: a file renamed out from
          # under the list below would stream a short archive and fail only
          # later, inside the docker build on the VPS.
          set -o pipefail
          tar -czf - \
            app/.dockerignore \
            app/.env.vps.example \
            app/Dockerfile.web \
            app/docker-compose.yml \
            app/package.json \
            app/pnpm-lock.yaml \
            app/tsconfig.json \
            app/vite.config.ts \
            app/public \
            app/scripts \
            app/src \
            app/server \
            app/deploy \
          | ssh -i ~/.ssh/id_ed25519 \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=6 \
              root@"$VPS_HOST" "deploy $GITHUB_SHA"
          # The keepalives are the deploy's heartbeat: the web image's pnpm
          # install can sit minutes without a byte in either direction, and a
          # silent SSH channel through NAT died at that exact spot — the build
          # finished on nobody's screen and the release never switched over.
