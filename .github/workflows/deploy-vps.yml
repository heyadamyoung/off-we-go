name: Deploy Off We Go to VPS

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/deploy-vps.yml'
      - '.github/actions/**'
  workflow_dispatch:

permissions:
  contents: read

# No workflow-level lock. There was one — `off-we-go-production`, over the
# whole run — and it meant a push waited for the previous push's deploy to
# finish before its own tests were allowed to start. Deploy 370 held it until
# 02:24:42, so 372's jobs, which share nothing with it and touch no box, sat
# in a queue from 02:19:52: four minutes and fifty seconds of a run that then
# tested in eighty-one seconds.
#
# Tests are independent and run the moment a commit lands. Deploys are
# serialized, because two of them on one box is a real conflict — and that
# lock lives on the deploy job, where the conflict is. By the time a deploy
# can start, the next commit's tests are usually already done and waiting.

# Jobs side by side rather than one chain: pushed to live was ten and a half
# minutes, of which nine and a half were one runner doing everything in turn.
# Each job below sets itself up in a few seconds — the shared steps live in
# .github/actions, and what they fetch (pnpm and the modules, the browser,
# ffmpeg, crane) comes out of the cache rather than off the network — and
# does its one thing. The deploy waits on all of them, so the test phase is
# the longest job and nothing else: the browser suite is dealt seven ways,
# the live suite runs on two stacks, and the release images are put together
# beside the unit tests, so the deploy is a pull and a restart.
jobs:
  checks:
    name: Lint, unit tests, the entrypoint and the release images
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The guard runs Caddy to validate the Caddyfile (the image Dockerfile.web
      # ships on); pulled in the background here so the pull overlaps the
      # install rather than the guard waiting for it.
      - name: Fetch the guard's Caddy
        run: nohup docker pull caddy:2.10-alpine > /tmp/caddy-pull.log 2>&1 &

      - uses: ./.github/actions/node
      - uses: ./.github/actions/crane

      - name: Lint and format check
        run: pnpm lint

      # Every job takes its modules from the cache by lockfile and installs
      # nothing; that the lockfile is the one package.json asks for is
      # checked here, once — a dependency changed without it fails the run.
      - name: Check the lockfile agrees with package.json
        run: pnpm install --frozen-lockfile --lockfile-only

      - name: Sign in to the registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # Three things side by side, none of which waits on another: the unit
      # tests; the deployment guard, which has docker here and so must run
      # its compose check rather than skip it; and the release images. On one
      # runner because every job a run asks for is a runner it may wait on,
      # and the images are mostly a wait on the registry that the tests fill.
      #
      # Neither image is built by Docker on a release. Each is a base and one
      # layer over it — the server over the api's base, the bundle over Caddy
      # — and crane writes that image into the registry as a manifest and a
      # blob, without pulling the base's layers to do it. Docker did pull
      # them, every release, to apply one COPY: most of a minute for the two
      # images, on the machine the deploy was waiting for. The box pulls the
      # same layers it always did, and only the new one when the base is the
      # one it has.
      #
      # The api's base is the Dockerfile's base stage — everything under the
      # server — built by Docker only when the stage, the dependencies or the
      # node image it starts from change, and named by a hash of them. The
      # bundle is built on the runner as Dockerfile.web builds it in a
      # container: against /api, stamped with the commit, and checked for a
      # file the shell names that the build did not write.
      - name: Unit tests, the entrypoint and the images
        env:
          IMAGE_REPO: ghcr.io/${{ github.repository }}
        run: |
          set -euo pipefail
          images() {
            VITE_API_URL=/api VITE_APP_SHA="$GITHUB_SHA" pnpm build
            node scripts/check-release-assets.mjs dist/client

            local repo="${IMAGE_REPO,,}"
            local stamp
            stamp=$(git log -1 --format=%ct)
            # Root-owned, in name order, at the commit's time, as COPY would
            # have it: the same tree is the same layer, whichever runner made it.
            layer() {
              tar --sort=name --owner=0 --group=0 --numeric-owner --mtime="@$stamp" "$@"
            }

            # What the base is made of: its stage, the node image it starts
            # from, the lockfile, and package.json without its scripts — a
            # test added to the unit suite is not a reason to rebuild the
            # runtime, and a rebuild is a minute.
            local node_image runtime base caddy
            node_image=$(sed -n 's/^FROM \([^ ]*\) AS base$/\1/p' server/Dockerfile)
            runtime=$(node -p 'const p = require("./package.json"); delete p.scripts; JSON.stringify(p)')
            base="$repo/api-base:$(cat server/Dockerfile pnpm-lock.yaml <(printf '%s' "$runtime") <(crane digest "$node_image") | sha256sum | cut -c1-16)"
            if ! crane manifest "$base" >/dev/null 2>&1; then
              echo "Building $base"
              docker buildx create --name release-base >/dev/null
              docker buildx build \
                --builder release-base \
                --file server/Dockerfile \
                --target base \
                --cache-from "type=registry,ref=$repo/api:buildcache" \
                --cache-to "type=registry,ref=$repo/api:buildcache,mode=max,compression=zstd" \
                --tag "$base" \
                --push .
            fi
            layer --exclude='server/node_modules' --exclude='server/.env*' --transform 's,^,app/,' -cf /tmp/server.tar server
            crane append -b "$base" -f /tmp/server.tar -t "$repo/api:$GITHUB_SHA"
            crane tag "$repo/api:$GITHUB_SHA" latest

            caddy=$(sed -n 's/^FROM \(caddy:[^ ]*\)$/\1/p' Dockerfile.web)
            layer --transform 's,^dist/client,srv,' -cf /tmp/web.tar dist/client
            crane append -b "$caddy" -f /tmp/web.tar -t "$repo/web:$GITHUB_SHA"
            crane tag "$repo/web:$GITHUB_SHA" latest
          }
          ( time pnpm test:unit ) > /tmp/unit.log 2>&1 &
          unit=$!
          ( time REQUIRE_DOCKER=1 pnpm test:guard ) > /tmp/guard.log 2>&1 &
          guard=$!
          ( time images ) > /tmp/images.log 2>&1 &
          built=$!
          failed=0
          wait "$unit" || failed=1
          wait "$guard" || failed=1
          wait "$built" || failed=1
          sed 's/^/[unit] /' /tmp/unit.log
          sed 's/^/[guard] /' /tmp/guard.log
          sed 's/^/[images] /' /tmp/images.log
          exit "$failed"

      - name: Sign out of the registry
        if: always()
        run: docker logout ghcr.io

  server:
    name: Server tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The test database, started in the background before the install so
      # its pull and its first start overlap it rather than holding it up: as
      # a service container it was nine seconds at the front of the job with
      # the runner otherwise idle. It lives for the job and is never read
      # back, so its files sit on memory. After the checkout, because the
      # job's working directory is the checkout.
      - name: Start the test database
        run: |
          nohup docker run -d --name postgres -p 5432:5432 \
            --tmpfs /var/lib/postgresql/data \
            -e POSTGRES_DB=offwego_test -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres \
            postgis/postgis:17-3.5-alpine > /tmp/postgres-start.log 2>&1 &

      - uses: ./.github/actions/node

      # Without it every video test quietly SKIPS. They have been skipping here
      # since they were written — "ok … # SKIP ffmpeg is not installed on this
      # machine" reads as a pass in the summary, so converting, the rendition
      # ladder and the whole of the object-storage path have only ever been
      # proved on somebody's laptop. The api image installs ffmpeg; the runner
      # that tests it should have it too.
      - uses: ./.github/actions/ffmpeg

      - name: Wait for the test database
        run: |
          for _ in $(seq 60); do
            docker exec postgres pg_isready -U postgres -d offwego_test > /dev/null 2>&1 && exit 0
            sleep 1
          done
          echo "the test database never answered"; cat /tmp/postgres-start.log; docker logs postgres; exit 1

      - name: Run server tests
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/offwego_test
        run: time pnpm test:server

  browser:
    name: Browser tests (${{ matrix.shard }} of 7)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      # To ask which sibling shards have a runner yet, and what they covered.
      actions: read
    defaults:
      run:
        working-directory: app
    strategy:
      fail-fast: true
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/node
      - uses: ./.github/actions/browser

      # A runner is sometimes handed a job forty seconds after the rest of
      # the run has begun — one job in perhaps every other run, any of them
      # — and the deploy waited on it. The shards given machines on time
      # cover for the one that was not (see scripts/shard-cover.mjs): each
      # asks which siblings have not started, takes a fixed share of each
      # such sibling's deal on top of its own, and says so with a marker.
      # The late shard, when its machine arrives, finds a marker from every
      # sibling and runs nothing; short of one, it runs its own deal, and a
      # test is run twice rather than not at all.
      - name: Cover the shards without a runner
        id: cover
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/shard-cover.mjs 7 ${{ matrix.shard }} >> "$GITHUB_OUTPUT"

      - name: Say which shards this one covers
        if: steps.cover.outputs.late != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cover-${{ steps.cover.outputs.late }}-by-${{ matrix.shard }}
          path: app/covered.txt
          retention-days: 1

      # A seventh of the tests each, dealt by weight so every shard holds
      # the same amount of work (see scripts/shard-tests.mjs), spread across
      # the runner's cores.
      #
      # The sample-mode bundle (see playwright.config) is built here while the
      # tests are dealt — the deal is two seconds of one core that would
      # otherwise wait for the build — and the suite is told to serve it.
      - name: Run browser tests
        if: steps.cover.outputs.skip != 'yes'
        env:
          COVERING: ${{ steps.cover.outputs.late }}
        run: |
          VITE_API_URL= pnpm build > /tmp/build.log 2>&1 &
          building=$!
          mapfile -t dealt < <(node scripts/shard-tests.mjs 7 ${{ matrix.shard }} --cover "$COVERING")
          [ "${#dealt[@]}" -gt 0 ] || { echo "nothing was dealt to this shard"; exit 1; }
          wait "$building" || { cat /tmp/build.log; exit 1; }
          time PREBUILT=1 pnpm exec playwright test "${dealt[@]}"

      # A CI-only flake with no trace is unfixable folklore; a failure here
      # hands its Playwright traces and DOM snapshots to the run page instead.
      - name: Keep the failure traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: browser-test-results-${{ matrix.shard }}
          path: app/test-results/
          retention-days: 7
          if-no-files-found: ignore

  live:
    name: Browser tests against a real server (${{ matrix.half }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app
    strategy:
      fail-fast: true
      matrix:
        # Two stacks rather than one: the bulk upload alone is half a minute
        # of the server resizing, and every other spec was slowed by sharing
        # the server with it. The upload specs get a stack of their own.
        half: [uploads, everything-else]
        include:
          - half: uploads
            specs: tests/live/bulk-upload-live.spec.js tests/live/upload-progress-live.spec.js
          - half: everything-else
            specs: >-
              tests/live/day-bar-live.spec.js tests/live/download-live.spec.js
              tests/live/map-photos-live.spec.js tests/live/photo-copies-live.spec.js
              tests/live/photo-exif-live.spec.js tests/live/share-live.spec.js
              tests/live/trip-days-live.spec.js tests/live/video-upload-live.spec.js
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/node
      # This stack converts real video.
      - uses: ./.github/actions/ffmpeg
      - uses: ./.github/actions/browser

      # The sample-mode suite runs in the shards above, where uploads never
      # leave the tab. This one has a real server behind it, so "does a film
      # actually upload" is a question CI can answer rather than infer.
      # Playwright itself rather than the package script: the specs are the
      # arguments, and a package manager between them and Playwright once
      # kept the `--` and ran every spec on both stacks.
      - name: Run browser tests against a real server
        run: time pnpm exec playwright test --config playwright.live.config.ts ${{ matrix.specs }}

      - name: Keep the failure traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: live-test-results-${{ matrix.half }}
          path: app/test-results/
          retention-days: 7
          if-no-files-found: ignore

  deploy:
    name: Deploy production
    needs: [checks, server, browser, live]
    runs-on: ubuntu-24.04
    # Five for the job, four for the release below. A deploy is a pull, a
    # schema step, two container swaps and a health check; deploy 370 did the
    # swaps in 3.3 seconds and the health check in 19. Anything that runs past
    # four minutes is not being slow, it is stuck, and a stuck deploy that
    # fails is worth more than one that holds the box for eleven minutes.
    timeout-minutes: 5
    # The box, one release at a time. This is the only real conflict in the
    # workflow and this is the only place it is locked.
    concurrency:
      group: off-we-go-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    environment:
      name: production
      url: https://offwego.to
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configure deployment SSH key
        env:
          VPS_DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Stage the release environment
        # /opt/wayfare/.env is not edited by hand. The values the running
        # server needs but the repository must never hold travel with the
        # release, and the deploy script folds them in and destroys the copy.
        env:
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
          MS_TENANT: ${{ secrets.MS_TENANT }}
          MAILBOX_TOKEN_KEY: ${{ secrets.MAILBOX_TOKEN_KEY }}
          CODEX_AUTH_JSON_B64: ${{ secrets.CODEX_AUTH_JSON_B64 }}
          GRAFANA_LOKI_TOKEN: ${{ secrets.GRAFANA_LOKI_TOKEN }}
          # Not secrets, just knobs — but nobody edits the box by hand, so they
          # ride the same pipeline. Empty values are skipped by merge-env.sh,
          # which leaves the compose defaults (luna, xhigh) in charge.
          WAYFARE_AI_MODEL: ${{ vars.WAYFARE_AI_MODEL }}
          PLACES_CONTACT: ${{ vars.PLACES_CONTACT }}
          WAYFARE_AI_REASONING: ${{ vars.WAYFARE_AI_REASONING }}
          # Which images this release is: the ones the images job pushed.
          IMAGE_REPO: ghcr.io/${{ github.repository }}
        run: |
          umask 077
          {
            echo "MS_CLIENT_ID=$MS_CLIENT_ID"
            echo "MS_CLIENT_SECRET=$MS_CLIENT_SECRET"
            echo "MS_TENANT=$MS_TENANT"
            echo "MAILBOX_TOKEN_KEY=$MAILBOX_TOKEN_KEY"
            echo "CODEX_AUTH_JSON_B64=$CODEX_AUTH_JSON_B64"
            echo "GRAFANA_LOKI_TOKEN=$GRAFANA_LOKI_TOKEN"
            echo "WAYFARE_AI_MODEL=$WAYFARE_AI_MODEL"
            echo "PLACES_CONTACT=$PLACES_CONTACT"
            echo "WAYFARE_AI_REASONING=$WAYFARE_AI_REASONING"
            echo "IMAGE_REPO=${IMAGE_REPO,,}"
            echo "IMAGE_TAG=$GITHUB_SHA"
          } > app/deploy/release.env

      # The pipeline's own token, good for this job and no longer: the box
      # signs in with it for the moment of the pull, signs out, and destroys
      # the copy before anything else runs (see deploy/github-deploy.sh).
      - name: Stage the registry credential
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          umask 077
          {
            echo "REGISTRY_USER=$REGISTRY_USER"
            echo "REGISTRY_TOKEN=$REGISTRY_TOKEN"
          } > app/deploy/registry.env

      - name: Stream release to the VPS
        # The release itself, bounded. Deploy 370 ran for 10m58s and 368 for
        # eighteen minutes, and in both cases the extra minutes bought nothing
        # — the release was either already live or never going to be. Four
        # minutes is a generous ceiling for a pull, a schema step, two
        # container swaps and a health check, and past it the ERR trap on the
        # box has already restored the previous release.
        timeout-minutes: 4
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
        run: |
          # tar's exit code is invisible without this: a file renamed out from
          # under the list below would stream a short archive and fail only
          # later, inside the docker build on the VPS.
          set -o pipefail
          tar -czf - \
            app/.dockerignore \
            app/.env.vps.example \
            app/Dockerfile.web \
            app/docker-compose.yml \
            app/package.json \
            app/pnpm-lock.yaml \
            app/tsconfig.json \
            app/vite.config.ts \
            app/public \
            app/scripts \
            app/src \
            app/server \
            app/deploy \
          | ssh -i ~/.ssh/id_ed25519 \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=6 \
              root@"$VPS_HOST" "deploy $GITHUB_SHA"
          # The keepalives are the deploy's heartbeat: the web image's pnpm
          # install can sit minutes without a byte in either direction, and a
          # silent SSH channel through NAT died at that exact spot — the build
          # finished on nobody's screen and the release never switched over.
