name: iOS TestFlight

on:
  # Only what ends up inside the binary. The server, the tests, the VPS deploy
  # and the Android project can all change without a beta being any different,
  # and a build nobody needs still costs the testers a download.
  push:
    branches: [main]
    paths:
      - 'app/src/**'
      - 'app/public/**'
      - 'app/ios/**'
      - 'app/capacitor.config.json'
      - 'app/pnpm-lock.yaml'
      - 'app/vite.config.ts'
      - 'app/tsconfig.json'
      - '.github/workflows/testflight.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: off-we-go-testflight
  # A flurry of pushes should leave one build, not five. The last one wins;
  # the ones it overtakes were never going to be installed by anybody.
  cancel-in-progress: true

jobs:
  archive-and-upload:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
      IOS_PROVISIONING_PROFILE_NAME: ${{ vars.IOS_PROVISIONING_PROFILE_NAME }}
      WAYFARE_DOMAIN: offwego.to
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      TESTFLIGHT_GROUPS: ${{ vars.TESTFLIGHT_GROUPS }}
      # Off by default: a build an evening is fine, ten notifications is not.
      TESTFLIGHT_NOTIFY: ${{ vars.TESTFLIGHT_NOTIFY }}
      # The build prerenders the shell by booting a server on "localhost" and
      # fetching it back. Where that resolves to ::1 first the fetch times out
      # and the build dies — the same fault the deploy image had. Both ends on
      # IPv4 and they find each other.
      NODE_OPTIONS: --dns-result-order=ipv4first
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.6.5

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install and synchronize iOS
        run: pnpm install --frozen-lockfile && VITE_API_URL="https://${WAYFARE_DOMAIN}/api" pnpm ios:sync

      - name: Run unit tests
        run: pnpm test:unit

      - name: Install CocoaPods
        run: cd ios/App && pod install

      - name: Install the App Store Connect API key
        env:
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          KEY_DIRECTORY="$RUNNER_TEMP/appstore-connect-private-keys"
          KEY_PATH="$KEY_DIRECTORY/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          mkdir -p "$KEY_DIRECTORY"
          printf '%s' "$APP_STORE_CONNECT_API_KEY_P8" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "APP_STORE_CONNECT_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Install distribution signing materials
        env:
          IOS_DISTRIBUTION_CERTIFICATE_P12: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/off-we-go-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          CERTIFICATE_PATH="$RUNNER_TEMP/off-we-go-distribution.p12"
          PROFILE_DIRECTORY="$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILE_PATH="$PROFILE_DIRECTORY/OffWeGo_App_Store_CI.mobileprovision"

          printf '%s' "$IOS_DISTRIBUTION_CERTIFICATE_P12" | base64 -D > "$CERTIFICATE_PATH"
          mkdir -p "$PROFILE_DIRECTORY"
          printf '%s' "$IOS_PROVISIONING_PROFILE" | base64 -D > "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Create export configuration
        run: >-
          node scripts/iosReleaseCore.mjs "$APPLE_TEAM_ID" "$IOS_BUNDLE_ID"
          "$IOS_PROVISIONING_PROFILE_NAME" > "$RUNNER_TEMP/ExportOptions.plist"

      - name: Archive Off We Go
        run: >-
          node scripts/iosArchive.mjs "$RUNNER_TEMP/OffWeGo.xcarchive"
          "$APPLE_TEAM_ID" "$GITHUB_RUN_NUMBER" "$WAYFARE_DOMAIN"

      - name: Upload to App Store Connect
        run: |
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/OffWeGo.xcarchive" \
            -exportPath "$RUNNER_TEMP/OffWeGoExport" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -authenticationKeyPath "$APP_STORE_CONNECT_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"

      # Uploading is not delivering: a build sits in App Store Connect until
      # something hands it to a tester group, and nothing here ever did — which
      # is how every upload succeeded while the testers stayed on an old build.
      - name: Release the build to the testers
        env:
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: node scripts/testflightRelease.mjs
