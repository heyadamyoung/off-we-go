<!doctype html>
<html lang="en">
  <head>

    <meta name="robots" content="noindex, nofollow" />
    <title>Install Off We Go</title>
    <style>
      :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f1ea; color: #17231d; }
      main { width: min(32rem, calc(100% - 2rem)); box-sizing: border-box; padding: 2rem; border-radius: 1.25rem; background: white; box-shadow: 0 1rem 3rem #24372c1f; text-align: center; }
      h1 { margin-top: 0; }
      p { line-height: 1.5; }
      a { display: inline-block; margin-top: 1rem; padding: 0.9rem 1.35rem; border-radius: 999px; background: #1e6748; color: white; font-weight: 700; text-decoration: none; }
      small { display: block; margin-top: 1.25rem; color: #657169; }
    </style>
  </head>
  <body>
    <main>
      <h1>Install Off We Go</h1>
      <p>Open this page in Safari on the registered iPad, then tap the button and approve the installation.</p>
      <a href="itms-services://?action=download-manifest&amp;url=https%3A%2F%2Foffwego.to%2Fadhoc%2Fmanifest.plist">Install on this iPad</a>
      <small>This signed build installs only on devices registered by the Off We Go developer.</small>
    </main>
  </body>
