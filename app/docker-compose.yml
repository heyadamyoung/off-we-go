name: wayfare

services:
  db:
    # PostGIS, for the places layer: a k-nearest-neighbour index over tens of
    # millions of points is the one thing plain PostgreSQL cannot do, and it is
    # what keeps "sights nearby" under a tenth of a second. Same PostgreSQL 17
    # on the same Alpine base, so the volume carries over untouched; migration
    # 043 creates the extension. See docs/places-layer.md.
    image: postgis/postgis:17-3.5-alpine
    restart: unless-stopped
    # Told how big the machine is.
    #
    # It had been running on stock defaults, which are sized for a laptop and
    # are what PostgreSQL ships so that it starts anywhere: 128 MB of shared
    # buffers on a box with sixty-two gigabytes, 4 MB of work memory, a
    # gigabyte of WAL between checkpoints, and a random-page cost tuned for a
    # disk that spins. That last set of numbers is not a missed optimisation,
    # it is the reason a deploy took eighteen minutes — see #202, where two
    # container recreates took six minutes each on a box that normally does
    # one in three seconds. A gigabyte of WAL while the sweep writes ten
    # million rows is a checkpoint every few seconds, each one flushing the
    # buffers and writing a full page image of everything touched since the
    # last, and the Docker daemon queues for the same disk.
    #
    # Every number below is a share of this box and says which:
    shm_size: 1gb
    command:
      - postgres
      # A quarter of memory, which is the long-standing rule and is what lets
      # the places table's hot pages stay resident instead of being read from
      # disk for every viewport.
      - -c
      - shared_buffers=12GB
      # What the planner believes the operating system is caching on top of
      # that. Too low and it costs index scans it should be choosing.
      - -c
      - effective_cache_size=40GB
      # Sixteen gigabytes between checkpoints rather than one. This is the
      # single number that was hurting: it turns a bulk load from a continuous
      # write storm into a checkpoint every few minutes, spread out by the
      # completion target below.
      - -c
      - max_wal_size=16GB
      - -c
      - min_wal_size=2GB
      - -c
      - checkpoint_completion_target=0.9
      # Less to write in the first place. The WAL is mostly page images of a
      # spatial index; they compress well and the CPU is idle when the disk
      # is not.
      - -c
      - wal_compression=on
      # Per sort, per connection, so it is multiplied by how busy the box is
      # rather than set to what one query would like. Sixteen megabytes keeps
      # the viewport and nearby queries in memory without letting a hundred
      # connections add up to more than the machine has.
      - -c
      - work_mem=16MB
      # Index builds and vacuums, which are one at a time and want room.
      - -c
      - maintenance_work_mem=2GB
      # An SSD. The default of 4.0 is the ratio for a disk that has to move a
      # head, and it biases the planner towards reading whole tables.
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      # Sixteen cores, and the places queries are the kind that parallelise.
      - -c
      - max_worker_processes=16
      - -c
      - max_parallel_workers=12
      - -c
      - max_parallel_workers_per_gather=4
      - -c
      - max_parallel_maintenance_workers=4
      # Autovacuum at the default cost limit cannot keep up with a table
      # taking ten million rows, and a table it falls behind on is one whose
      # statistics go stale and whose dead tuples are read by every scan.
      - -c
      - autovacuum_max_workers=4
      - -c
      - autovacuum_vacuum_cost_limit=2000
      # Durability is untouched: fsync and synchronous_commit stay on. This is
      # the real database and nothing here trades somebody's trip for speed.
    environment:
      POSTGRES_DB: wayfare
      POSTGRES_USER: wayfare
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wayfare -d wayfare"]
      interval: 5s
      timeout: 5s
      retries: 20

  logto-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: logto
      POSTGRES_USER: logto
      POSTGRES_PASSWORD: ${LOGTO_POSTGRES_PASSWORD:?set LOGTO_POSTGRES_PASSWORD in .env}
    volumes:
      - logto_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logto -d logto"]
      interval: 5s
      timeout: 5s
      retries: 20

  logto:
    image: ghcr.io/logto-io/logto:1.41.0
    restart: unless-stopped
    entrypoint: ["sh", "-c", "npm run cli db seed -- --swe && npm start"]
    environment:
      TRUST_PROXY_HEADER: "1"
      ENDPOINT: https://${LOGTO_DOMAIN:?set LOGTO_DOMAIN in .env}
      ADMIN_ENDPOINT: https://${LOGTO_ADMIN_DOMAIN:?set LOGTO_ADMIN_DOMAIN in .env}
      DB_URL: postgresql://logto:${LOGTO_POSTGRES_PASSWORD}@logto-db:5432/logto
      SECRET_VAULT_KEK: ${LOGTO_SECRET_VAULT_KEK:?set LOGTO_SECRET_VAULT_KEK in .env}
    depends_on:
      logto-db:
        condition: service_healthy

  api:
    # Built here at a desk (install.sh does the same); on the box, pulled by
    # commit from the registry the pipeline pushed to — the same Dockerfile
    # either way, so what was tested is what runs.
    image: ${IMAGE_REPO:-ghcr.io/heyadamyoung/off-we-go}/api:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://wayfare:${POSTGRES_PASSWORD}@db:5432/wayfare
      UPLOAD_DIR: /data/uploads
      WAYFARE_ADMIN_EMAIL: ${WAYFARE_ADMIN_EMAIL}
      WAYFARE_PUBLIC_URL: https://${WAYFARE_DOMAIN}
      WAYFARE_SESSION_SECRET: ${WAYFARE_SESSION_SECRET}
      WAYFARE_OAUTH_SECRET: ${WAYFARE_OAUTH_SECRET}
      # Who to blame, and the switch for the enrichment pipeline.
      #
      # Wikimedia's policy requires a User-Agent naming the application and a
      # way to reach its operator; they enforce it, and a pipeline asking a
      # donation-funded service millions of questions anonymously would
      # deserve the block it got. places/enrich/wikimedia.js refuses to start
      # without one, so this being empty is what keeps the pipeline off — a
      # switch nobody can set while leaving the address blank.
      PLACES_CONTACT: ${PLACES_CONTACT:-}
      WAYFARE_OIDC_ISSUER: ${WAYFARE_OIDC_ISSUER:?set WAYFARE_OIDC_ISSUER in .env}
      WAYFARE_OIDC_CLIENT_ID: ${WAYFARE_OIDC_CLIENT_ID:?set WAYFARE_OIDC_CLIENT_ID in .env}
      WAYFARE_OIDC_CLIENT_SECRET: ${WAYFARE_OIDC_CLIENT_SECRET:?set WAYFARE_OIDC_CLIENT_SECRET in .env}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS_B64: ${SMTP_PASS_B64:-}
      SMTP_FROM: ${SMTP_FROM}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID}
      APPLE_BUNDLE_ID: ${APPLE_BUNDLE_ID:-ai.threadway.wayfare}
      ANDROID_PACKAGE_NAME: ${ANDROID_PACKAGE_NAME:-ai.threadway.wayfare}
      ANDROID_SHA256_CERT_FINGERPRINTS: ${ANDROID_SHA256_CERT_FINGERPRINTS:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MS_CLIENT_ID: ${MS_CLIENT_ID:-}
      MS_CLIENT_SECRET: ${MS_CLIENT_SECRET:-}
      MS_TENANT: ${MS_TENANT:-common}
      MAILBOX_TOKEN_KEY: ${MAILBOX_TOKEN_KEY:-}
      WAYFARE_MAX_VIDEO_BYTES: ${WAYFARE_MAX_VIDEO_BYTES:-}
      WAYFARE_STOP_RADIUS_METRES: ${WAYFARE_STOP_RADIUS_METRES:-}
      # Conversion runs inside the API today because this is one box. When it
      # is several, set this to 0 on the web nodes and run the same image with
      # a higher count on a worker node — the queue coordinates them.
      WAYFARE_MEDIA_WORKERS: ${WAYFARE_MEDIA_WORKERS:-1}
      WAYFARE_TRANSCODE: ${WAYFARE_TRANSCODE:-on}
      # Adaptive renditions as well as the single file. Several encodes and a
      # few times the storage per film, which is what buys a video that keeps
      # playing when the line gets worse rather than stopping.
      WAYFARE_VIDEO_LADDERS: ${WAYFARE_VIDEO_LADDERS:-1}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-auto}
      # The account minio-init makes for this service, never the root one: a
      # leaked application key can read and write one bucket and nothing else.
      # The default matches what minio-init creates, so the two cannot drift.
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-offwego-api}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      S3_PREFIX: ${S3_PREFIX:-}
      # How wide the window in which every reader gets the same media URL, and
      # how long anything in front of us may hold the bytes. The first is what
      # makes a cache possible at all; the second is what stops a deleted
      # photograph outliving its deletion at an edge.
      WAYFARE_MEDIA_LINK_WINDOW: ${WAYFARE_MEDIA_LINK_WINDOW:-3600}
      WAYFARE_MEDIA_CACHE_SECONDS: ${WAYFARE_MEDIA_CACHE_SECONDS:-3600}
      CODEX_AUTH_JSON_B64: ${CODEX_AUTH_JSON_B64:-}
      # On by default: the engine's coverage follows the trips on its own.
      # Empty this out to turn routing off entirely.
      VALHALLA_URL: ${VALHALLA_URL:-http://valhalla:8002}
      VALHALLA_WANTED_FILE: /valhalla-tiles/wanted_tile_urls
      CODEX_HOME: /data/codex
      WAYFARE_AI_MODEL: ${WAYFARE_AI_MODEL:-gpt-5.6-luna}
      WAYFARE_AI_REASONING: ${WAYFARE_AI_REASONING:-xhigh}
      # Traces: auto-instrumented at boot via NODE_OPTIONS, shipped to the
      # alloy sidecar. Metrics and OTel logs stay off — logs already flow
      # through docker, and pino gains trace ids from the same hook.
      NODE_OPTIONS: --import=@opentelemetry/auto-instrumentations-node/register
      OTEL_SERVICE_NAME: offwego-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      # No cloud-metadata probing: the default detectors wait out a timeout
      # against GCP/AWS endpoints that will never answer this VPS.
      OTEL_NODE_RESOURCE_DETECTORS: env,host,os
    volumes:
      - ./data/uploads:/data/uploads
      # A named volume rather than a bind mount: Codex rewrites its own login
      # as tokens rotate, and the image pre-creates this path owned by node.
      - codex_data:/data/codex
      # The places layer's parsed Parquet footers and release indexes. Kept
      # across deploys because a cold box otherwise pays sixteen downloads —
      # about 25MB — before it can drain a single cell or answer a degraded
      # query. Named volume, same reason as codex: the image pre-creates the
      # path owned by node, and a bind mount would arrive owned by root.
      - places_data:/data/places
      # Shared with the routing engine: the api writes the wanted-extracts
      # list here; the engine's supervisor builds from it.
      - valhalla_tiles:/valhalla-tiles
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # NODE_OPTIONS is cleared: the probe inherits the container env, and
      # loading the whole OTel SDK per probe blew the five-second budget —
      # the server listened in seconds while its own healthcheck timed out,
      # and the deploy rolled a healthy release back. Loki told the story.
      test: ["CMD-SHELL", "NODE_OPTIONS='' node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      # Boot is allowed to take a while, because migrations run before the
      # server listens and a migration can be waiting its turn for a table
      # the sweep is writing to. Twelve probes over two minutes was the whole
      # budget once, and a release that was doing exactly the right thing —
      # asking politely for a lock, backing off, asking again — was declared
      # dead and rolled back. Failures inside the start period do not count
      # against the retries, so this buys time without making a genuinely
      # broken release take any longer to be spotted.
      # Long, because a boot can carry a migration and a migration can carry
      # real work — the index over ten million places is minutes on this box.
      # It must not be shorter than the deploy's --wait-timeout, or compose
      # calls a release failed while its own healthcheck still calls it
      # starting. Probing stays every ten seconds, so a broken release is
      # still caught in under a minute once the boot is over.
      start_period: 900s

  # The planet, once, in the background.
  #
  # The queue in the API drains four one-degree cells a minute, which is the
  # right rate for the cells a trip touches and about nine days for the
  # 53,333 the release has data in. This is the other job: read the sixteen
  # Parquet parts once each, post every row into the cell it falls in, and
  # write those cells through the same ingest (see places/sweep.js). Measured
  # at 7,250 places a second on a sixteen-core box, which is the whole planet
  # in under three hours and about 88 GB of table and index.
  #
  # Its own service rather than `docker compose exec` in the API, for one
  # reason: a deploy recreates the API container and would kill a run three
  # hours long every twenty minutes. A profiled service is not touched by
  # `compose up`, so it outlives releases. `restart: no` because a finished
  # sweep is finished; the deploy starts it again if there is more to do, and
  # --resume means that costs only the cells still owing.
  #
  #     docker compose --profile sweep up -d places-sweep      start it
  #     docker compose logs -f places-sweep                    watch it
  #     docker compose stop places-sweep                       stop it; the
  #         cell in flight is abandoned rather than half-written, and the
  #         next run picks up from the coverage rows
  places-sweep:
    image: ${IMAGE_REPO:-ghcr.io/heyadamyoung/off-we-go}/api:${IMAGE_TAG:-latest}
    profiles: ["sweep"]
    # The retry of last resort, and the only one a bug in the sweep itself
    # cannot defeat. The script exits non-zero when there is more to do and it
    # is worth doing again, zero when the planet is loaded or when a run made
    # no progress at all — so this restarts a crash, an out-of-memory kill, a
    # reboot and a release deleted mid-run, and does not restart a finished
    # sweep or spin on one that is getting nowhere. --resume means each
    # restart pays only for the cells still owing.
    restart: on-failure
    # Peak is about 1.5 million records held across the cells still open. Eight
    # gigabytes on a box with fifty-seven free is not a cost worth counting,
    # and the alternative is an out-of-memory kill two hours in. The indexes
    # stay up: search on a box people are using is worth more than the fraction
    # of the run dropping them would save.
    command:
      - node
      - --max-old-space-size=8192
      - server/scripts/places-ingest.mjs
      - --planet
      - --sweep
      - --resume
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://wayfare:${POSTGRES_PASSWORD}@db:5432/wayfare
      # The same footer and index cache the API keeps, so a sweep starting
      # after a release does not re-parse sixteen 1.6 MB footers.
      PLACES_INDEX_DIR: /data/places
      PLACES_RELEASE: ${PLACES_RELEASE:-}
    # No CPU or I/O limit, deliberately.
    #
    # There was one for a release: four cores of sixteen and a low block-IO
    # weight, after deploy 368 spent six minutes on each of two container
    # recreates while this was running. That was the wrong lever. The box has
    # sixteen cores and sixty-two gigabytes and was being brought down by a
    # database configured for a laptop — a gigabyte of WAL between
    # checkpoints while ten million rows go in is a continuous write storm,
    # and everything else on the machine, the Docker daemon included, queues
    # behind it for the disk. See the db service above.
    #
    # Rationing a process is what you do when the machine is genuinely too
    # small. This one is not, and a backfill that finishes sooner is worth
    # having, so it gets the box when the box is idle.
    volumes:
      - places_data:/data/places
    depends_on:
      db:
        condition: service_healthy

  # Object storage on this box, speaking S3.
  #
  # Not because one volume was full, but because one volume is the thing that
  # stops there being a second web node: a bind mount belongs to one machine,
  # and every photograph on it has to be backed up by tarring the lot. A
  # bucket is reachable from anywhere, replaces the nightly tar with the
  # store's own durability, and — once a CDN is in front — is what the edge
  # fills itself from.
  #
  # Behind a profile, so a deployment that is not using object storage does
  # not run it, is not asked for credentials it has no use for, and cannot be
  # broken by it. Turning it on is two lines in .env:
  #
  #     COMPOSE_PROFILES=objectstore
  #     MINIO_ROOT_PASSWORD=...        (and S3_SECRET_ACCESS_KEY)
  #
  # then `pnpm media:migrate` to move what is already on the volume, and only
  # then S3_BUCKET. Pointing the app at an empty bucket would leave every
  # existing photograph with nothing pointing at it.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    profiles: ["objectstore"]
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-offwego}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
      BUCKET: ${S3_BUCKET_NAME:-offwego-media}
      APP_KEY: ${S3_ACCESS_KEY_ID:-offwego-api}
      APP_SECRET: ${S3_SECRET_ACCESS_KEY:-}
      # Browsers are never sent here directly; the api reads and writes on
      # their behalf, so the console is the only human-facing part.
      MINIO_BROWSER_REDIRECT_URL: http://127.0.0.1:9001
    # The bucket and the api's own account are made here rather than by a
    # second one-shot container: `compose up --wait` and a container that
    # exits on purpose do not get along, and this has to be idempotent
    # anyway — it runs again on every restart and finds its work done.
    #
    # The setup cannot take the server down with it. It leans on `mc`, which
    # ships in this image, and if that ever stops being true the server still
    # runs, the bucket is simply not made, and the deploy's cutover finds no
    # bucket to copy into and leaves media on the volume. That is a quiet
    # no-op; the alternative — a container that will not start — fails
    # `compose up --wait` and rolls back a release that was otherwise fine.
    entrypoint:
      - sh
      - -c
      - >
        if [ $${#MINIO_ROOT_PASSWORD} -lt 8 ] || [ -z "$$APP_SECRET" ]; then
        echo "MINIO_ROOT_PASSWORD (8+ chars) and S3_SECRET_ACCESS_KEY must be set in .env before object storage can run." >&2;
        exit 78;
        fi;
        minio server /data --console-address ":9001" &
        server=$$!;
        (
        tries=0;
        until mc alias set box http://127.0.0.1:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" 2>/dev/null; do
        tries=$$((tries + 1));
        [ $$tries -gt $${SETUP_TRIES:-60} ] && echo "the object store never answered; the bucket was not made" >&2 && exit 1;
        sleep 1;
        done;
        mc mb --ignore-existing "box/$$BUCKET" || exit 1;
        mc anonymous set none "box/$$BUCKET" || exit 1;
        mc admin user add box "$$APP_KEY" "$$APP_SECRET" || true;
        printf '%s' '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:GetObject","s3:PutObject","s3:DeleteObject","s3:ListBucket","s3:GetBucketLocation"],"Resource":["arn:aws:s3:::'"$$BUCKET"'","arn:aws:s3:::'"$$BUCKET"'/*"]}]}' > /tmp/policy.json;
        mc admin policy create box offwego-media /tmp/policy.json || true;
        mc admin policy attach box offwego-media --user "$$APP_KEY" || true;
        echo "bucket $$BUCKET is ready for $$APP_KEY";
        ) || echo "the object store came up but could not be set up; media stays where it is" >&2;
        wait $$server
    ports:
      # Loopback only, reachable through an SSH tunnel. The bucket holds every
      # photograph anyone has taken on a trip; it does not go on the internet.
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    # No healthcheck on purpose. `compose up --wait` treats a service without
    # one as ready once it is running, and a probe that leans on a tool being
    # in the image is one more way for object storage to fail a deploy that
    # has nothing to do with it. Whether the bucket is actually usable is
    # answered where it matters: the copy fails and media stays on the volume.

  web:
    image: ${IMAGE_REPO:-ghcr.io/heyadamyoung/off-we-go}/web:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_API_URL: /api
        VITE_APP_SHA: ${RELEASE_SHA:-dev}
    restart: unless-stopped
    environment:
      WAYFARE_DOMAIN: ${WAYFARE_DOMAIN}
      LOGTO_DOMAIN: ${LOGTO_DOMAIN}
      LOGTO_ADMIN_DOMAIN: ${LOGTO_ADMIN_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy

  # Log shipping to Grafana Cloud Loki. The night the family's gates vanished
  # per-phone, there was no record of what the server answered anyone — this
  # is that record. Reads container stdout off the Docker socket, read-only,
  # and sleeps politely when no token is configured, so the stack deploys the
  # same with observability on or off.
  alloy:
    image: grafana/alloy:v1.5.1
    restart: unless-stopped
    entrypoint:
      - sh
      - -c
      - >
        if [ -z "$$GRAFANA_LOKI_TOKEN" ]; then
        echo "GRAFANA_LOKI_TOKEN is not set; log shipping is off.";
        sleep infinity;
        fi;
        exec alloy run --disable-reporting --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    environment:
      # The stack's own coordinates, read off its Loki datasource; only the
      # token is secret, and it rides the release pipeline like the others.
      GRAFANA_LOKI_URL: ${GRAFANA_LOKI_URL:-https://logs-prod-018.grafana.net/loki/api/v1/push}
      GRAFANA_LOKI_USER: ${GRAFANA_LOKI_USER:-1619648}
      GRAFANA_LOKI_TOKEN: ${GRAFANA_LOKI_TOKEN:-}
      GRAFANA_TEMPO_URL: ${GRAFANA_TEMPO_URL:-tempo-prod-13-prod-ca-east-0.grafana.net:443}
      GRAFANA_TEMPO_USER: ${GRAFANA_TEMPO_USER:-1613949}
      GRAFANA_PROM_URL: ${GRAFANA_PROM_URL:-https://prometheus-prod-32-prod-ca-east-0.grafana.net/api/prom/push}
      GRAFANA_PROM_USER: ${GRAFANA_PROM_USER:-3247946}
    volumes:
      - ./deploy/alloy.config:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
      - alloy_data:/var/lib/alloy/data

  valhalla:
    # The routing engine: real road travel times over loopback for the legs
    # endpoint and the assistant's get_travel_times. Nothing to configure —
    # the api derives which OSM extracts matter from where the trips' stops
    # are and writes the list onto the shared volume; the supervisor script
    # downloads, builds and restarts as coverage grows. Until the first stop
    # exists it idles, costing nothing.
    image: ghcr.io/valhalla/valhalla-scripted:latest
    restart: unless-stopped
    entrypoint: ['sh', '/supervise.sh']
    environment:
      # Bumping this forces compose to recreate the container: the box was
      # found still running the ORIGINAL stock-entrypoint container days
      # after the supervisor shipped — nothing listening on 8002, every
      # route falling back to the crow, and zero log lines to say so.
      SUPERVISOR_REV: '5'
    volumes:
      - ./deploy/valhalla-supervise.sh:/supervise.sh:ro
      - valhalla_tiles:/custom_files

volumes:
  postgres_data:
  minio_data:
  logto_postgres_data:
  codex_data:
  places_data:
  caddy_data:
  caddy_config:
  alloy_data:
  valhalla_tiles:
