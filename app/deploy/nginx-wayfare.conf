server {
    listen 443 ssl;
    listen [::]:443 ssl ipv6only=on;

    server_name wayfare.threadway.ai;
    root /var/www/wayfare/current;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/wayfare.threadway.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wayfare.threadway.ai/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=()" always;

    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    location = /index.html {
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name wayfare.threadway.ai;
    return 301 https://wayfare.threadway.ai$request_uri;
}
