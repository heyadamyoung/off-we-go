# Netlify. The build needs VITE_SUPABASE_URL and VITE_SUPABASE_PUBLISHABLE_KEY
# set in Site settings -> Environment variables (VITE_SUPABASE_ANON_KEY is still
# read, for a project set up before Supabase renamed it). They are baked in at
# build time, so changing either needs a redeploy, not just a restart.
#
# Both are safe to expose: the key identifies the project, not the caller, and
# row level security grants the anonymous role nothing at all.
[build]
  base    = "app"
  command = "pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Single-page app: every path serves index.html so the magic-link callback,
# which comes back to whatever URL it was sent from, is not a 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
